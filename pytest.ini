[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# --strict-markers / --strict-config turn a typo in a marker or an unknown ini
# key into an error instead of a silently ignored line. Verbosity is NOT set
# here: the documented command is `python3 -m pytest -q`, and a -q in addopts
# would make that -qq and swallow the summary line.
addopts = --strict-markers --strict-config --tb=short
markers =
    live: touches this machine's real state (the ~/OneDrive fuse mount, the icon
        theme). Never the network, never rclone. Deselect with -m "not live".
    slow: renders or installs something; still under a second.
